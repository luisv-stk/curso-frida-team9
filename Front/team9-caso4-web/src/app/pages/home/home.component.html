<div class="container">
<app-header> </app-header>


  <div class="main-content">
    <div class="left-panel">
      <h1>CREA TU PROPIO BANCO DE IMÁGENES PERSONALIZADO</h1>

      <div class="panel-buttons">
      <p>Nuestro gestor de imágenes con IA facilitará:</p>
      <mat-form-field appearance="fill" class="search-field">
        <input matInput placeholder="Buscar">
      </mat-form-field>
      <button mat-button class="action-button">Descargar</button>
      <button mat-button class="action-button">Clasificar</button>
      </div>
      <div class="image-preview">
        <img src="https://placehold.co/180x150/jpg" alt="City Image">
        <img src="https://placehold.co/180x150/jpg" alt="Building Image">
        <img src="https://placehold.co/180x150/jpg" alt="Skyscraper Image">
        <img src="https://placehold.co/180x150/jpg" alt="Food Image 1">
        <img src="https://placehold.co/180x150/jpg" alt="Food Image 2">
        <img src="https://placehold.co/180x150/jpg" alt="Food Image 3">
      </div>
    </div>

    <div class="right-panel">
      <div class="upload-container">
        <mat-icon class="upload-icon">add</mat-icon>
        <p class="upload-text">Arrastra varias imágenes</p>
          <p class="upload-text">(o selecciona una carpeta)</p>
      </div>
    </div>
  </div>
</div>
