<div class="container">
  <header class="header">
    <mat-icon>insert_emoticon</mat-icon>
    <div class="user-controls">
      <button mat-button>EN</button>
      <button mat-button>
        <img src="https://placehold.co/40x40/jpg" alt="User" class="user-image">
        Jane Doe
      </button>
      <mat-icon>notifications</mat-icon>
    </div>
  </header>
  <div class="main-content">
    <div class="left-panel">
      <h1>CREA TU PROPIO BANCO DE<br>IMÁGENES PERSONALIZADO</h1>
      <p>Nuestro gestor de imágenes con IA facilitará:</p>
      <mat-form-field appearance="fill" class="search-field">
        <input matInput placeholder="Buscar">
      </mat-form-field>
      <button mat-button class="action-button">Descargar</button>
      <button mat-button class="action-button">Clasificar</button>
      <div class="image-preview">
        <img src="https://placehold.co/100x100/jpg" alt="City Image">
        <img src="https://placehold.co/100x100/jpg" alt="Building Image">
        <img src="https://placehold.co/100x100/jpg" alt="Skyscraper Image">
        <img src="https://placehold.co/100x100/jpg" alt="Food Image 1">
        <img src="https://placehold.co/100x100/jpg" alt="Food Image 2">
        <img src="https://placehold.co/100x100/jpg" alt="Food Image 3">
      </div>
    </div>
    <div class="right-panel">
      <div class="drop-zone">
        <mat-icon>add_circle</mat-icon>
        <p>Arrastra varias imágenes<br>(o selecciona una carpeta)</p>
      </div>
    </div>
  </div>
</div>
